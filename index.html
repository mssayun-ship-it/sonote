:root{--bg:#f2f2f7;--paper:#fff;--side:#fff;--ink:#000;--mute:#8a8a8e;--line:#e5e5ea;--acc:#007aff;--onacc:#fff;--accbg:#e5f0ff;--hov:#eef4ff;--f1:"Twemoji Country Flags",-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,Sarabun,sans-serif;--f2:var(--f1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--paper:#1c1c1e;--side:#1c1c1e;--ink:#fff;--mute:#98989d;--line:#38383a;--accbg:#10284a;--hov:#16233a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--paper:#1c1c1e;--side:#1c1c1e;--ink:#fff;--mute:#98989d;--line:#38383a;--accbg:#10284a;--hov:#16233a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f2)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{display:grid;grid-template-columns:270px 1fr;height:100%}
aside{background:var(--side);border-right:.5px solid var(--line);overflow:auto;padding:18px 12px}
main{overflow:auto;padding:22px clamp(16px,4vw,44px) 90px}
.wrap{max-width:920px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--f1);color:inherit;text-decoration:none;padding:4px 8px 16px}
.lg0{width:34px;height:34px;display:grid;place-items:center;font-size:20px;border-radius:9px;background:var(--accbg);object-fit:cover;flex:none}
.nv{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-family:var(--f1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv span{width:24px;text-align:center;font-size:18px}
.nv:hover{background:var(--hov)}.nv.on{background:var(--accbg);color:var(--acc);font-weight:600}
.sh{color:var(--mute);font:13px var(--f1);margin:18px 10px 4px}
h1{font:700 34px/1.15 var(--f1);letter-spacing:-.02em;margin:0}h3{font:600 17px var(--f1);margin:0}
.hint{color:var(--mute);margin:4px 0 0}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--accbg);color:var(--acc);border-radius:10px;padding:8px 16px;font:600 15px var(--f1)}
.btn:active{opacity:.6}.btn.pri{background:var(--acc);color:var(--onacc)}.btn.dn{color:#ff3b30;background:color-mix(in srgb,#ff3b30 12%,var(--paper))}
.back{color:var(--acc);text-decoration:none;font:500 17px var(--f1)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:2px 0 14px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:6px}
.card{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--paper);border-radius:16px;color:inherit;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card b{font:600 16px var(--f1)}.card small{color:var(--mute)}.ci{font-size:30px}
a.card:active,.li:active{opacity:.7}
.card.add{align-items:center;justify-content:center;color:var(--acc);background:var(--accbg);box-shadow:none;min-height:110px;font:600 16px var(--f1)}
.cov{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--accbg);display:grid;place-items:center;font-size:38px}
.mv{position:absolute;right:8px;top:8px;display:none;background:var(--paper);border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25)}.card:hover .mv{display:block}
.mv button{padding:2px 7px}
.list{background:var(--paper);border-radius:14px;overflow:hidden;margin-top:6px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;color:inherit;text-decoration:none;border-top:.5px solid var(--line)}
.li:first-child{border-top:0}.li:hover{background:var(--hov)}.li:after{content:"›";color:var(--mute);font-size:22px}
.ic{font-size:24px;width:32px;text-align:center}.li>div{flex:1;min-width:0}.li b{display:block;font-weight:600}
.li small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- country typeahead (trip filter + trip country) ---- */
let CCB=null,RGE=null;
const enName=c=>{try{RGE=RGE||new Intl.DisplayNames(['en'],{type:'region'});return RGE.of(c)||c}catch(e){return c}};
const ccNorm=s=>String(s||'').replace(/[\u{1F1E6}-\u{1F1FF}]/gu,'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function ccList(inp){const q=inp.dataset.dirty?ccNorm(inp.value):'',m=tripStats(),keep=inp.id==='tcq'&&cur()?cur().c:'';
let L=(inp.id==='ccq'?Object.keys(m):COUNTRIES.map(x=>x[0]).filter(c=>!CCAL[c]||c===keep)).map(c=>({c,n:inp.id==='ccq'?m[c]:0,nm:cname(c),en:enName(c)}));
const hit=x=>ccNorm(x.nm).includes(q)||ccNorm(x.en).includes(q)||x.c.toLowerCase()===q,st=x=>ccNorm(x.nm).startsWith(q)||ccNorm(x.en).startsWith(q)?0:1;
if(q)L=L.filter(hit);L.sort((a,b)=>(q?st(a)-st(b):0)||(inp.id==='ccq'?b.n-a.n:0)||a.nm.localeCompare(b.nm,locale()));return L.slice(0,80)}
function ccDraw(){if(!CCB)return;let m=$('#ccl');if(!m){m=document.createElement('div');m.id='ccl';m.setAttribute('role','listbox');m.addEventListener('mousedown',e=>e.preventDefault());m.addEventListener('click',e=>{const b=e.target.closest('[data-pc]');if(b)ccPick(b.dataset.pc)});document.body.append(m)}
m.innerHTML=CCB.items.length?CCB.items.map((x,i)=>`<button class="${i===CCB.i?'on':''}" data-pc="${x.c}" role="option"><span class="sli">${flag(x.c)}</span><span class="ccn">${esc(x.nm)}</span>${x.n?`<small>${x.n}</small>`:''}</button>`).join(''):'<p class="hint">No matching country</p>';
const r=CCB.inp.getBoundingClientRect(),w=Math.max(r.width,240);m.style.width=w+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';const hh=m.offsetHeight||260;let top=r.bottom+4;if(top+hh>innerHeight-8&&r.top-hh-4>8)top=r.top-hh-4;m.style.top=Math.max(8,top)+'px';
const on=m.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'})}
function ccOpen(inp){CCB={inp,i:0,items:ccList(inp)};ccDraw()}
function ccClose(){CCB=null;const m=$('#ccl');if(m)m.remove()}
function ccPick(c){const id=CCB&&CCB.inp.id;ccClose();if(!c)return;if(id==='ccq'){TCF=c;render()}else if(id==='tcq'){const t=cur();if(t){t.c=c;touch(t);save();render()}}}
const isCC=t=>t&&t.classList&&t.classList.contains('ccin');
document.addEventListener('focusin',e=>{if(isCC(e.target)){e.target.dataset.dirty='';ccOpen(e.target);if(e.target.select)e.target.select()}});
document.addEventListener('input',e=>{if(isCC(e.target)){e.target.dataset.dirty='1';CCB={inp:e.target,i:0,items:ccList(e.target)};ccDraw()}});
document.addEventListener('focusout',e=>{const t=e.target;if(isCC(t))setTimeout(()=>{if(document.activeElement!==t){ccClose();if(t.id==='tcq'&&t.isConnected&&cur())t.value=flag(cur().c)+' '+cname(cur().c);else if(t.id==='ccq'&&t.isConnected)t.value=''}},0)});
document.addEventListener('keydown',e=>{if(!CCB||e.target!==CCB.inp||e.isComposing||e.keyCode===229)return;const k=e.key,n=CCB.items.length;
if(k==='ArrowDown'||k==='ArrowUp'){e.preventDefault();if(n){CCB.i=(CCB.i+(k==='ArrowDown'?1:n-1))%n;ccDraw()}}
else if(k==='Enter'){e.preventDefault();e.stopPropagation();if(n)ccPick(CCB.items[CCB.i].c)}
else if(k==='Escape'){e.preventDefault();ccClose()}},true);

่รับผิดชอบต่อข้อมูลที่สูญหายหรือความเสียหายอื่นที่เกิดจากการใช้งาน"], ["การเปลี่ยนแปลง", "เราอาจปรับปรุงข้อกำหนดนี้และแอปเป็นครั้งคราว การใช้ SoNote ต่อไปถือว่าคุณยอมรับข้อกำหนดที่ปรับปรุงแล้ว"]]], "privacy": ["นโยบายความเป็นส่วนตัวของ Sonote", [["ข้อมูลที่เรารวบรวมและวิธีที่เราใช้", "• **บันทึกและข้อมูลส่วนบุคคล:** Sonote ไม่เก็บรวบรวม ไม่จัดเก็บบนเซิร์ฟเวอร์ภายนอก และไม่ส่งข้อมูลส่วนบุคคลหรือเนื้อหาบันทึกของคุณให้บุคคลที่สาม บันทึกหรือการตั้งค่าที่บันทึกไว้เพื่อความสะดวกจะอยู่ในที่เก็บข้อมูลของเบราว์เซอร์/อุปกรณ์ของคุณ (เช่น Local Storage) ภายใต้การควบคุมของคุณ\n• **ไม่ขายหรือแบ่งปันข้อมูล:** เราไม่ขาย ให้เช่า หรือแลกเปลี่ยนข้อมูลผู้ใช้กับบุคคลที่สาม"], ["บริการของ Google และการเปิดเผยการใช้งานอย่างจำกัด (หากมี)", "หากคุณเลือกลงชื่อเข้าใช้หรือเชื่อมต่อกับบริการของ Google:\n• เราเข้าถึงเฉพาะข้อมูลที่จำเป็นอย่างยิ่งต่อฟีเจอร์ที่คุณเปิดใช้เองเท่านั้น\n• ข้อมูลที่ได้จาก Google APIs จะ **ไม่** ถูกนำไปใช้แสดงโฆษณา ขายให้ผู้ค้าข้อมูล หรือใช้ฝึกโมเดล AI/ML ทั่วไป โดยไม่ได้รับความยินยอมอย่างชัดแจ้ง\n• การใช้และการถ่ายโอนข้อมูลที่ได้รับจาก Google APIs ของ Sonote เป็นไปตาม *Google API Services User Data Policy* รวมถึงข้อกำหนด Limited Use"], ["การซิงก์ Google Drive (ไม่บังคับ)", "Sonote มีการซิงก์ระหว่างอุปกรณ์ของคุณผ่าน Google Drive ของคุณเองเป็นทางเลือก และจะปิดอยู่จนกว่าคุณจะเปิดเอง\n• **สิทธิ์ที่ขอ:** เฉพาะสโคป \"App Data\" ของ Google Drive (drive.appdata) ซึ่งให้ Sonote เข้าถึงโฟลเดอร์แอปที่ซ่อนอยู่ใน Drive ของคุณ ที่มีเพียง Sonote เปิดได้ Sonote ไม่สามารถเห็น อ่าน หรือแก้ไขไฟล์อื่นใน Google Drive ของคุณ\n• **สิ่งที่จัดเก็บ:** สำเนาสมุดของคุณ (เพจ ไดอารี่ สิ่งที่ต้องทำ ตารางเวลา นัดหมาย รายรับรายจ่าย ทริป อัลบั้ม รูปภาพ และการตั้งค่า) ในโฟลเดอร์ที่ซ่อนอยู่นั้น\n• **การส่งข้อมูล:** ข้อมูลส่งตรงระหว่างอุปกรณ์ของคุณกับ Google Drive ของคุณเอง ไม่ถูกส่งไปยังเซิร์ฟเวอร์ของ Sonote หรือถึงเรา\n• **การควบคุมของคุณ:** หยุดได้ทุกเมื่อด้วย \"Stop syncing\" ในหน้า Customize และลบข้อมูลที่จัดเก็บไว้หรือยกเลิกสิทธิ์ของ Sonote ได้จากการตั้งค่าบัญชี Google ของคุณ รูปภาพที่ซิงก์ใช้พื้นที่ Google Drive ของคุณ"], ["อัตราแลกเปลี่ยนและบริการของบุคคลที่สาม", "• **อัตราแลกเปลี่ยน:** เพื่อแปลงสกุลเงิน Sonote ขออัตราแลกเปลี่ยนรายวันจาก open.er-api.com คำขอนี้ไม่มีเนื้อหาบันทึกของคุณ เช่นเดียวกับการเข้าเว็บไซต์ทั่วไป บริการนั้นอาจเห็นที่อยู่ IP และประเภทเบราว์เซอร์ของคุณ\n• **วันหยุดประจำปี:** หากคุณเลือกปฏิทินวันหยุดในหน้า Diary Sonote จะขอข้อมูลวันหยุดของประเทศและปีนั้นจาก nagerholidays.com (Nager.Date) คำขอมีเพียงรหัสประเทศและปี ไม่มีเนื้อหาบันทึกของคุณ บริการนั้นอาจเห็นที่อยู่ IP และประเภทเบราว์เซอร์ของคุณ\n• **ฟอนต์:** ขึ้นอยู่กับเวอร์ชันที่ใช้ อาจมีการโหลดฟอนต์เว็บจากผู้ให้บริการฟอนต์ เช่น Google Fonts ซึ่งอาจเห็นที่อยู่ IP ของคุณ\n• บริการเหล่านี้มีนโยบายความเป็นส่วนตัวของตนเอง Sonote ไม่เพิ่มเครื่องมือวิเคราะห์ โฆษณา หรือติดตามของตัวเอง"], ["การโฮสต์และบันทึกเซิร์ฟเวอร์", "เว็บไซต์ที่โฮสต์ Sonote อาจเก็บบันทึกเซิร์ฟเวอร์มาตรฐาน (เช่น ที่อยู่ IP ประเภทเบราว์เซอร์ และเวลาของแต่ละคำขอ) เพื่อความปลอดภัยและการดำเนินงาน บันทึกของคุณไม่ได้เก็บบนเซิร์ฟเวอร์นั้นและไม่สามารถอ่านได้จากบันทึกเหล่านี้"], ["ที่เก็บข้อมูลของเบราว์เซอร์และความปลอดภัย", "• Sonote ใช้ที่เก็บข้อมูลของเบราว์เซอร์ที่จำเป็น (เช่น Local Storage หรือคุกกี้ที่จำเป็นต่อการทำงาน) เพื่อรองรับฟังก์ชันจดบันทึกหลักเท่านั้น เราไม่ใช้ตัวติดตามโฆษณาข้ามเว็บไซต์ที่ล่วงล้ำความเป็นส่วนตัว\n• คุณสามารถล้างบันทึกหรือที่เก็บข้อมูลของเบราว์เซอร์ได้ทุกเมื่อ จากเบราว์เซอร์หรือเมนูควบคุมในแอปโดยตรง"], ["การเปลี่ยนแปลงนโยบายความเป็นส่วนตัว", "เราอาจปรับปรุงนโยบายความเป็นส่วนตัวนี้เป็นครั้งคราวเพื่อสะท้อนการอัปเดตแอปหรือข้อกำหนดด้านการปฏิบัติตามกฎหมาย วันที่ \"อัปเดตล่าสุด\" ด้านบนแสดงว่าฉบับล่าสุดมีผลเมื่อใด"], ["ติดต่อเรา", "หากมีคำถามเกี่ยวกับนโยบายความเป็นส่วนตัวนี้หรือ Sonote โปรดติดต่อเราที่:\n**อีเมล:** {email}"]], "**Sonote** คือเว็บแอปจดบันทึกที่เรียบง่าย เราเคารพความเป็นส่วนตัวของคุณ และไม่เก็บรวบรวม ดึงข้อมูล หรือหารายได้จากข้อมูลส่วนบุคคลหรือเนื้อหาบันทึกของผู้ใช้"], "lu": "อัปเดตล่าสุด", "ct": "ติดต่อ", "bk": "กลับ", "ld": "25 พฤศจิกายน 2026"}},LEG_DATE='2026-11-25';

const GG={
en:{cat:'Guide',
 p:{t:'How to use Pages',i:'📄',h:(f)=>`<h2>Pages are your free-form notes</h2><p>Use a page for anything: lists, recipes, meeting notes, ideas or plans.</p><p><img src="${f('list')}"></p><ol><li><b>New Page</b> creates a blank page.</li><li>The <b>eye</b> hides a page from the list (open the <b>Hidden</b> tab to bring it back).</li><li>The <b>⋮ menu</b> on each row has <b>Edit</b> and <b>Delete</b>.</li></ol><h3>Write a page</h3><p>Open <b>Pages</b> in the left menu and tap <b>New Page</b>. Type a title, write your text, then press <b>Save</b>. Open any page to read it and press <b>Edit</b> to change it.</p><p><img src="${f('edit')}"></p><ol><li><b>Save</b> keeps your changes.</li><li>Tap the icon next to the title to choose an icon or emoji.</li><li>Choose a <b>category</b> or add <b>#tags</b> so pages are easy to find. Search also understands <b>#tags</b>.</li><li>The toolbar has bold, italic, underline, headings, alignment, indent, text color, highlight and <b>Link to…</b>, which links to another page: type its name and press Enter.</li><li><b>Pin</b> shows the page on Overview and in the left menu. <b>Delete</b> removes it.</li></ol><h3>Good to know</h3><ul><li>Choose a font, text size, text color and page background for each page.</li><li>The <b>Related</b> box at the bottom lists linked pages in both directions.</li><li>Deleting a page cannot be undone. Make a backup first (see the “How to use Customize” page).</li></ul>`},
 c:{t:'How to use Customize',i:'🎨',h:(f)=>`<h2>Make SoNote look like yours</h2><p>Open <b>Customize</b> in the left menu. Press <b>Save</b> when you are done to keep your changes.</p><p><img src="${f('cust')}"></p><ol><li><b>Name & logo</b>: rename the notebook and choose an emoji, an icon or your own photo as the logo.</li><li><b>Language</b>: English, Thai, Chinese or Japanese.</li><li><b>Fonts</b>: one font for titles, buttons and menu, another for body text.</li><li><b>Colors</b>: background, cards, accent and text. You can also set the transparency of cards and add a background or card image.</li><li><b>Menu icons</b>: change the icon of each menu item and tint it with any color. <b>Reset</b> returns to the default.</li></ol><h3>Keep your data safe</h3><p>Further down the same page are three cards. Your notes live in this browser, so use at least one of them.</p><p><img src="${f('data')}"></p><ol><li><b>Google Drive sync</b> (when enabled for this app) keeps phone and computer the same. See “Use SoNote on phone and computer”.</li><li><b>Data folder</b> (Chrome or Edge on a computer) saves a readable copy in a folder you choose, with one subfolder for each menu.</li><li><b>Backup</b> saves everything to a single file. Use <b>Download backup</b> now and then, and <b>Import backup…</b> to restore it on any device.</li></ol>`},
 s:{t:'Use SoNote on phone and computer',i:'🔄',h:(f)=>`<h2>Same notebook on every device</h2><p>SoNote stores your notes on your own device. To use it on your phone and your computer with the same content, install it and turn on sync.</p><h3>1. Open and install the app</h3><p>Open the same SoNote link on each device, then install it like an app. It opens in its own window and works offline.</p><p><img src="${f('pwa')}"></p><ul><li><b>iPhone</b>: open the link in Safari, tap Share, then <b>Add to Home Screen</b>.</li><li><b>Android</b>: open the link in Chrome, tap the ⋮ menu, then <b>Install app</b> (or Add to Home screen).</li><li><b>Computer</b>: in Chrome or Edge, click the install icon in the address bar.</li></ul><h3>2. Turn on sync</h3><p>Open <b>Customize</b> → <b>Google Drive sync</b> → <b>Connect Google Drive</b> and sign in. Do the same on your other devices with the <b>same Google account</b>.</p><p><img src="${f('sync')}"></p><ul><li>Your data is kept in a hidden app folder in your own Google Drive that only SoNote can open. It is never sent to anyone else.</li><li>SoNote syncs when you open the app, when you come back to it and every few minutes while it is open and online. If the same item was changed on two devices, the version on the device you are using wins.</li><li>Photos use some of your Google Drive storage.</li></ul><h3>No Google Drive sync card?</h3><p>Use a backup file instead. On the first device choose <b>Customize</b> → <b>Download backup</b>, send the file to the other device and choose <b>Import backup…</b>. Repeat whenever you want to move changes across.</p>`}},
th:{cat:'คู่มือ',
 p:{t:'วิธีใช้เพจ',i:'📄',h:(f)=>`<h2>เพจคือสมุดโน้ตอิสระของคุณ</h2><p>ใช้เพจจดอะไรก็ได้ เช่น รายการ สูตรอาหาร บันทึกการประชุม ไอเดีย หรือแผนงาน</p><p><img src="${f('list')}"></p><ol><li><b>เพจใหม่</b> สร้างเพจเปล่า</li><li>ไอคอน <b>ตา</b> ซ่อนเพจจากรายการ (ไปที่แท็บ <b>Hidden</b> เพื่อนำกลับมา)</li><li>เมนู <b>⋮</b> ท้ายแต่ละแถวมี <b>แก้ไข</b> และ <b>ลบ</b></li></ol><h3>เขียนเพจ</h3><p>เปิด <b>Pages</b> ในเมนูด้านซ้าย แล้วกด <b>เพจใหม่</b> พิมพ์ชื่อเรื่อง เขียนเนื้อหา แล้วกด <b>บันทึก</b> เปิดเพจใดก็ได้เพื่ออ่าน และกด <b>แก้ไข</b> เมื่ออยากเปลี่ยนเนื้อหา</p><p><img src="${f('edit')}"></p><ol><li><b>บันทึก</b> เก็บการเปลี่ยนแปลงของคุณ</li><li>กดไอคอนข้างชื่อเรื่องเพื่อเลือกไอคอนหรืออีโมจิ</li><li>เลือก <b>หมวดหมู่</b> หรือเพิ่ม <b>#แท็ก</b> เพื่อให้หาเพจง่าย ช่องค้นหาเข้าใจ <b>#แท็ก</b> ด้วย</li><li>แถบเครื่องมือมี ตัวหนา ตัวเอียง ขีดเส้นใต้ หัวข้อ การจัดแนว การเยื้อง สีตัวอักษร ไฮไลต์ และ <b>ลิงก์ไปที่…</b> สำหรับลิงก์ไปเพจอื่น พิมพ์ชื่อเพจแล้วกด Enter</li><li><b>ปักหมุด</b> แสดงเพจในหน้า Overview และเมนูด้านซ้าย ส่วน <b>ลบ</b> คือลบเพจ</li></ol><h3>ควรรู้</h3><ul><li>เลือกฟอนต์ ขนาดตัวอักษร สีตัวอักษร และสีพื้นหลังของแต่ละเพจได้</li><li>กล่อง <b>Related</b> ด้านล่างแสดงเพจที่ลิงก์ถึงกันทั้งสองทิศทาง</li><li>การลบเพจย้อนกลับไม่ได้ ควรสำรองข้อมูลก่อน (ดูเพจ “วิธีใช้หน้าปรับแต่ง”)</li></ul>`},
 c:{t:'วิธีใช้หน้าปรับแต่ง',i:'🎨',h:(f)=>`<h2>ทำให้ SoNote เป็นสไตล์ของคุณ</h2><p>เปิด <b>Customize</b> ในเมนูด้านซ้าย เมื่อปรับเสร็จแล้วกด <b>บันทึก</b> เพื่อเก็บการเปลี่ยนแปลง</p><p><img src="${f('cust')}"></p><ol><li><b>ชื่อและโลโก้</b>: เปลี่ยนชื่อสมุด และเลือกอีโมจิ ไอคอน หรือรูปของคุณเองเป็นโลโก้</li><li><b>ภาษา</b>: อังกฤษ ไทย จีน หรือญี่ปุ่น</li><li><b>ฟอนต์</b>: ฟอนต์หนึ่งสำหรับชื่อเรื่อง ปุ่ม และเมนู อีกฟอนต์สำหรับเนื้อหา</li><li><b>สี</b>: พื้นหลัง การ์ด สีหลัก และตัวอักษร ปรับความโปร่งใสของการ์ด และใส่รูปพื้นหลังหรือรูปการ์ดได้</li><li><b>ไอคอนเมนู</b>: เปลี่ยนไอคอนของแต่ละเมนูและใส่สีได้ตามต้องการ กด <b>Reset</b> เพื่อกลับไปค่าเริ่มต้น</li></ol><h3>เก็บข้อมูลให้ปลอดภัย</h3><p>ลงไปด้านล่างของหน้าเดียวกันจะมีการ์ด 3 ใบ ข้อมูลของคุณอยู่ในเบราว์เซอร์นี้ จึงควรใช้อย่างน้อยหนึ่งอย่าง</p><p><img src="${f('data')}"></p><ol><li><b>ซิงก์กับ Google Drive</b> (เมื่อแอปนี้เปิดใช้) ทำให้มือถือและคอมพิวเตอร์ข้อมูลตรงกัน ดูเพจ “ใช้ SoNote บนมือถือและคอมพิวเตอร์”</li><li><b>โฟลเดอร์ข้อมูล</b> (Chrome หรือ Edge บนคอมพิวเตอร์) เก็บสำเนาที่เปิดอ่านได้ไว้ในโฟลเดอร์ที่คุณเลือก โดยแยกโฟลเดอร์ย่อยตามแต่ละเมนู</li><li><b>สำรองข้อมูล</b> เก็บทุกอย่างลงไฟล์เดียว กด <b>ดาวน์โหลดไฟล์สำรอง</b> เป็นระยะ และ <b>นำเข้าไฟล์สำรอง…</b> เพื่อกู้คืนบนเครื่องไหนก็ได้</li></ol>`},
 s:{t:'ใช้ SoNote บนมือถือและคอมพิวเตอร์',i:'🔄',h:(f)=>`<h2>สมุดเล่มเดียวกันทุกเครื่อง</h2><p>SoNote เก็บบันทึกไว้ในอุปกรณ์ของคุณเอง หากอยากใช้ทั้งมือถือและคอมพิวเตอร์โดยข้อมูลตรงกัน ให้ติดตั้งแอปและเปิดการซิงก์</p><h3>1. เปิดและติดตั้งแอป</h3><p>เปิดลิงก์ SoNote เดียวกันบนทุกเครื่อง แล้วติดตั้งเหมือนแอป แอปจะเปิดในหน้าต่างของตัวเองและใช้ออฟไลน์ได้</p><p><img src="${f('pwa')}"></p><ul><li><b>iPhone</b>: เปิดลิงก์ใน Safari กดปุ่มแชร์ แล้วเลือก <b>เพิ่มลงในหน้าจอโฮม</b></li><li><b>Android</b>: เปิดลิงก์ใน Chrome กดเมนู ⋮ แล้วเลือก <b>ติดตั้งแอป</b> (หรือ เพิ่มลงในหน้าจอหลัก)</li><li><b>คอมพิวเตอร์</b>: ใน Chrome หรือ Edge กดไอคอนติดตั้งที่แถบที่อยู่</li></ul><h3>2. เปิดการซิงก์</h3><p>ไปที่ <b>Customize</b> → <b>ซิงก์กับ Google Drive</b> → <b>เชื่อมต่อ Google Drive</b> แล้วเข้าสู่ระบบ ทำแบบเดียวกันบนเครื่องอื่นโดยใช้ <b>บัญชี Google เดียวกัน</b></p><p><img src="${f('sync')}"></p><ul><li>ข้อมูลถูกเก็บในโฟลเดอร์แอปที่ซ่อนอยู่ใน Google Drive ของคุณเอง ซึ่งมีแต่ SoNote เปิดได้ และไม่ถูกส่งให้ผู้อื่น</li><li>SoNote ซิงก์เมื่อเปิดแอป เมื่อกลับมาที่แอป และทุกไม่กี่นาทีขณะที่แอปเปิดอยู่และออนไลน์ หากรายการเดียวกันถูกแก้บนสองเครื่อง ระบบใช้เวอร์ชันบนเครื่องที่คุณกำลังใช้อยู่</li><li>รูปภาพใช้พื้นที่ Google Drive ของคุณบางส่วน</li></ul><h3>ไม่มีการ์ดซิงก์กับ Google Drive?</h3><p>ใช้ไฟล์สำรองแทน บนเครื่องแรกเลือก <b>Customize</b> → <b>ดาวน์โหลดไฟล์สำรอง</b> ส่งไฟล์ไปอีกเครื่อง แล้วเลือก <b>นำเข้าไฟล์สำรอง…</b> ทำซ้ำเมื่ออยากย้ายการเปลี่ยนแปลงข้ามเครื่อง</p>`}}};
function guidePages(L){const l=GG[L]?L:'en',G=GG[l],f=k=>gfig(k,l);return [['p-guide-pages','p'],['p-guide-custom','c'],['p-guide-sync','s']].map(([id,k])=>({id,t:G[k].t,i:G[k].i,cat:G.cat,rel:[],ct:Date.now(),h:G[k].h(f)}))}

/* ---- backup / restore ---- */
let BKP=null,BKU=null;
const BK_FMT='sonote-backup',mbs=n=>(Math.round(n/104857.6)/10).toFixed(1);
const bkJson=()=>JSON.stringify({app:BK_FMT,v:1,at:new Date().toISOString(),data:S});
async function persistS(){const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'s');t.oncomplete=ok;t.onerror=()=>no(t.error)});fsKick()}
function bkExport(){try{const json=bkJson(),u=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='SoNote-backup-'+ymd(new Date())+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);flash('Backup created — check your Downloads folder')}catch(e){flash('Could not create backup')}}
async function bkCopy(){try{await navigator.clipboard.writeText(bkJson());flash('Copied backup to clipboard')}catch(e){flash('Could not copy — use Download')}}
function bkRead(text){let o;try{o=JSON.parse(text)}catch(e){flash('Not a valid backup file');return}
const d=o&&o.app===BK_FMT?o.data:null;if(!d||typeof d!=='object'||!Array.isArray(d.pages)||!Array.isArray(d.albums)||!Array.isArray(d.trips)||!d.cfg||typeof d.cfg!=='object'){flash('Not a SoNote backup');return}
const ph=(d.albums||[]).reduce((s,a)=>s+((a&&a.ph)||[]).length,0)+(d.trips||[]).reduce((s,t)=>s+((t&&t.d)||[]).reduce((n,x)=>n+((x&&x.ph)||[]).length,0),0);
BKP={data:d,at:String(o.at||'').slice(0,10),mb:mbs(text.length),n:[['Pages',d.pages.length],['Diary',Object.keys(d.diary||{}).length],['Expenses',(d.ex||[]).length],['Gallery',(d.albums||[]).length],['Trips',(d.trips||[]).length]],ph};render()}
async function bkApply(){if(!BKP)return;const d=BKP.data,prev=JSON.stringify(S);S=d;try{norm();await persistS()}catch(e){S=JSON.parse(prev);flash('Could not import');return}
BKU=prev;BKP=null;ED_ID=null;if(FSH&&FSST.s==='wait'){FSST.s='on';fsKick(300)}document.documentElement.lang=lang();iniRG();flash('Saved — backup imported');render()}
async function bkUndo(){if(!BKU)return;try{S=JSON.parse(BKU);norm();await persistS()}catch(e){flash('Could not import');return}BKU=null;document.documentElement.lang=lang();iniRG();flash('Saved — previous data restored');render()}
function bkSection(){let st='';
if(BKP)st=`<div class="bkc"><p><b>Replace all data here with this backup?</b></p><p class="bks">${BKP.at?`<span>${esc(BKP.at)}</span>`:''}${BKP.n.map(([l,n])=>`<span><b>${n}</b> <small>${l}</small></span>`).join('')}<span>${icon('picture',14)} <b>${BKP.ph}</b></span><span><b>${BKP.mb}</b> MB</span></p><p class="hint">Everything currently in this notebook will be replaced. Download a backup of it first if you want to keep it.</p><div class="row"><button class="btn pri" data-act="bkgo">Replace everything</button><button class="btn" data-act="bkno">Cancel</button></div></div>`;
else if(BKU)st=`<div class="bkc"><p>Backup imported.</p><div class="row"><button class="btn" data-act="bkundo">Undo import</button></div></div>`;
return `<section class="pn" style="margin-top:16px"><h3>Backup</h3><p class="hint">Save everything (pages, diary, expenses, photos and settings) to one file, then load it back on another browser or computer. Your data is stored only in this browser, so back it up from time to time.</p><div class="row"><button class="btn pri" data-act="bkexp">${icon('download',16)}Download backup</button><button class="btn" data-act="bkimp">${icon('upload',16)}Import backup…</button><button class="btn" data-act="bkcopy">${icon('copy',16)}Copy backup</button></div>${st}<details class="bkp"><summary>Paste backup text instead</summary><textarea id="bkt" rows="4" placeholder="Paste backup text here" spellcheck="false"></textarea><button class="btn" data-act="bktext">Import pasted text</button></details></section>`}
/* ---- language, currency, image editor ---- */
const LANGS=[['en','English'],['th','ไทย'],['zh','中文'],['ja','日本語']],LOCS={en:'en-US',th:'th-TH-u-ca-gregory',zh:'zh-CN',ja:'ja-JP'},LI={th:0,zh:1,ja:2};
const lang=()=>(S&&S.cfg&&S.cfg.lang)||'en',locale=()=>LOCS[lang()]||'en-US';

function trsx(t,L){if(Object.hasOwn(TRD,t))return TRD[t][L]||t;
if(t.indexOf(' · ')>0)return t.split(' · ').map(x=>trsx(x,L)).join(' · ');
for(const [re,o] of TRP){const m=re.exec(t);if(m)return o[L].replace(/\$(\d)/g,(_,i)=>trsx(m[i]||'',L))}
return t}
